<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe iPhone 14 - Mobile App</title>
    <meta name="description" content="Applicazione mobile wireframe in bianco e nero in formato iPhone 14 con navigazione a due pagine." />
    <meta property="og:title" content="Wireframe iPhone 14 - Mobile App" />
    <meta property="og:description" content="Applicazione mobile wireframe in bianco e nero in formato iPhone 14 con navigazione a due pagine." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tailwind CSS CDN per GitHub Pages statico -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Stili Wireframe e Pattern Grafico */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #000000;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      .bg-wireframe-grid {
        background-size: 24px 24px;
        background-image: 
          linear-gradient(to right, rgba(0, 0, 0, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.07) 1px, transparent 1px);
      }

      .wireframe-shadow {
        box-shadow: 4px 4px 0px 0px #000000;
      }

      .wireframe-shadow-sm {
        box-shadow: 2px 2px 0px 0px #000000;
      }

      .wireframe-shadow-lg {
        box-shadow: 10px 10px 0px 0px #000000;
      }

      /* Transizioni slide tra le schermate */
      .screen-page {
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
      }

      .screen-page.hidden-left {
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
        display: none !important;
      }

      .screen-page.hidden-right {
        transform: translateX(100%);
        opacity: 0;
        pointer-events: none;
        display: none !important;
      }

      .screen-page.active {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
        display: flex !important;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col bg-white text-black">

    <!-- Header Canvas Wireframe -->
    <header class="border-b-2 border-black bg-white px-4 py-3 flex flex-wrap items-center justify-between gap-3 z-30">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 border-2 border-black flex items-center justify-center font-mono font-bold text-xs bg-black text-white">
          W
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-wider uppercase font-mono">
            Wireframe Prototype · iPhone 14
          </h1>
          <p class="text-xs text-neutral-500 font-mono">
            Dimensioni: 390 × 844 px · Monocromatico B&amp;W · Standalone HTML
          </p>
        </div>
      </div>

      <!-- Barra di controllo e indicatore di pagina -->
      <div class="flex items-center gap-2 sm:gap-3 text-xs font-mono">
        <div class="border border-black px-2.5 py-1 bg-neutral-100 flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-black"></span>
          <span id="page-indicator">PAGINA 1 DI 2</span>
        </div>

        <!-- Selettore Zoom / Scala -->
        <div class="hidden sm:flex items-center border border-black divide-x divide-black bg-white">
          <button id="zoom-75" class="px-2 py-1 hover:bg-neutral-100 transition-colors">75%</button>
          <button id="zoom-90" class="px-2 py-1 bg-black text-white transition-colors">90%</button>
          <button id="zoom-100" class="px-2 py-1 hover:bg-neutral-100 transition-colors">100%</button>
        </div>

        <!-- Toggle Griglia -->
        <button id="toggle-grid" class="border border-black px-2.5 py-1 flex items-center gap-1.5 bg-black text-white transition-colors" title="Attiva/Disattiva griglia wireframe">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
          </svg>
          <span class="hidden md:inline">Griglia</span>
        </button>

        <!-- Toggle Chassis Cornice iPhone -->
        <button id="toggle-chassis" class="border border-black px-2.5 py-1 flex items-center gap-1.5 bg-black text-white transition-colors" title="Mostra/Nascondi cornice iPhone 14">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="3"/>
            <line x1="12" y1="18" x2="12" y2="18.01"/>
          </svg>
          <span class="hidden md:inline">Chassis</span>
        </button>
      </div>
    </header>

    <!-- Area Workspace / Artboard Wireframe -->
    <main id="canvas-area" class="flex-1 flex items-center justify-center p-4 sm:p-8 relative overflow-auto bg-wireframe-grid">
      <div class="absolute top-2 left-4 text-[10px] font-mono text-neutral-400 pointer-events-none hidden lg:block">
        (X: 0, Y: 0) · Viewport Target: iPhone 14 [390 × 844 pt]
      </div>

      <!-- Wrapper Scalabile del Dispositivo -->
      <div id="device-scaler" style="transform: scale(0.9); transform-origin: center center;" class="transition-transform duration-200 my-auto py-2">
        
        <!-- Scocca Esterna iPhone 14 (Chassis Wireframe) -->
        <div id="iphone-chassis" class="relative mx-auto transition-all duration-300 w-[416px] h-[870px] bg-white border-4 border-black rounded-[54px] wireframe-shadow-lg p-[10px]">
          
          <!-- Pulsanti fisici hardware wireframe sul profilo sinistro -->
          <div id="btn-hardware-mute" class="absolute -left-[9px] top-[115px] w-[6px] h-[26px] bg-black rounded-l-sm"></div>
          <div id="btn-hardware-volup" class="absolute -left-[9px] top-[160px] w-[6px] h-[50px] bg-black rounded-l-sm"></div>
          <div id="btn-hardware-voldown" class="absolute -left-[9px] top-[225px] w-[6px] h-[50px] bg-black rounded-l-sm"></div>

          <!-- Pulsante accensione profilo destro -->
          <div id="btn-hardware-power" class="absolute -right-[9px] top-[180px] w-[6px] h-[75px] bg-black rounded-r-sm"></div>

          <!-- Fessura altoparlante superiore -->
          <div id="chassis-speaker" class="absolute top-[16px] left-1/2 -translate-x-1/2 w-[60px] h-[4px] bg-black rounded-full z-30"></div>

          <!-- Schermo Effettivo iPhone 14 (390px × 844px) -->
          <div id="iphone-screen" class="w-[390px] h-[844px] bg-white overflow-hidden relative flex flex-col border-2 border-black rounded-[44px]">
            
            <!-- Notch iPhone 14 (Silhouette Wireframe Nera) -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[160px] h-[30px] bg-black rounded-b-[20px] z-30 flex items-center justify-center">
              <div class="flex items-center gap-3">
                <div class="w-2.5 h-2.5 rounded-full border border-neutral-600 bg-neutral-900"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-neutral-700"></div>
              </div>
            </div>

            <!-- Barra di Stato iOS (9:41, Segnale, Wi-Fi, Batteria) -->
            <div class="w-full h-[48px] px-7 pt-3.5 flex items-center justify-between text-black font-semibold text-xs tracking-tight z-20 shrink-0 select-none">
              <span class="font-mono">9:41</span>
              <div class="flex items-center gap-2">
                <!-- Segnale cellulare -->
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M2 20h2M7 20v-4M12 20v-8M17 20V4"/>
                </svg>
                <!-- Wi-Fi -->
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
                </svg>
                <!-- Batteria -->
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <rect x="2" y="7" width="16" height="10" rx="2"/>
                  <line x1="22" y1="11" x2="22" y2="13"/>
                  <line x1="6" y1="11" x2="10" y2="11"/>
                </svg>
              </div>
            </div>

            <!-- CONTENITORE SCHERMATE DELL'APP -->
            <div class="flex-1 relative w-full h-full overflow-hidden">

              <!-- ======================================================== -->
              <!-- PAGINA 1: COMPLETAMENTE VUOTA, SOLO UN BOTTONE "avanti"   -->
              <!-- ======================================================== -->
              <div id="pagina-1" class="screen-page active absolute inset-0 w-full h-full flex items-center justify-center p-6">
                <button
                  id="btn-avanti"
                  class="group relative px-10 py-4 bg-white text-black font-mono font-bold text-lg tracking-wider uppercase border-2 border-black wireframe-shadow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_0px_#000000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 flex items-center gap-3"
                  aria-label="Vai a Pagina 2"
                >
                  <span>avanti</span>
                  <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </div>

              <!-- ======================================================== -->
              <!-- PAGINA 2: COMPLETAMENTE VUOTA, SOLO UN BOTTONE "indietro" -->
              <!-- ======================================================== -->
              <div id="pagina-2" class="screen-page hidden-right absolute inset-0 w-full h-full items-center justify-center p-6">
                <button
                  id="btn-indietro"
                  class="group relative px-10 py-4 bg-white text-black font-mono font-bold text-lg tracking-wider uppercase border-2 border-black wireframe-shadow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_0px_#000000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 flex items-center gap-3"
                  aria-label="Torna a Pagina 1"
                >
                  <svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                  </svg>
                  <span>indietro</span>
                </button>
              </div>

            </div>

            <!-- Home Indicator Barra Inferiore iPhone 14 -->
            <div class="w-full pb-3 flex justify-center z-20 shrink-0">
              <div class="w-36 h-1 bg-black rounded-full"></div>
            </div>

          </div>
        </div>
      </div>
    </main>

    <!-- Footer Toolbar / Guida di Flusso Wireframe -->
    <footer class="border-t-2 border-black bg-white px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between text-xs font-mono text-neutral-600 gap-2 z-30">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <span class="font-bold text-black">FLUSSO NAVIGAZIONE:</span>
          <span id="nav-step-1" class="font-bold text-black underline">[Pagina 1: avanti]</span>
          <span>⇄</span>
          <span id="nav-step-2" class="text-neutral-400">[Pagina 2: indietro]</span>
        </div>
      </div>

      <div class="flex items-center gap-4 text-[11px] text-neutral-500">
        <span>Tastiera: [→ / Invio] = Avanti · [← / Esc] = Indietro</span>
        <button id="btn-reset" class="hover:text-black flex items-center gap-1 border border-neutral-300 px-2 py-0.5" title="Reimposta a Pagina 1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Reset</span>
        </button>
      </div>
    </footer>

    <!-- Logica JavaScript Vanilla Integrata al 100% (Zero Moduli, Zero File Esterni) -->
    <script>
      (function() {
        // Elementi DOM principali
        const pag1 = document.getElementById('pagina-1');
        const pag2 = document.getElementById('pagina-2');
        const btnAvanti = document.getElementById('btn-avanti');
        const btnIndietro = document.getElementById('btn-indietro');
        const pageIndicator = document.getElementById('page-indicator');
        const navStep1 = document.getElementById('nav-step-1');
        const navStep2 = document.getElementById('nav-step-2');
        const btnReset = document.getElementById('btn-reset');

        // Controlli Zoom e Vista
        const deviceScaler = document.getElementById('device-scaler');
        const zoom75 = document.getElementById('zoom-75');
        const zoom90 = document.getElementById('zoom-90');
        const zoom100 = document.getElementById('zoom-100');
        const toggleGrid = document.getElementById('toggle-grid');
        const toggleChassis = document.getElementById('toggle-chassis');
        const canvasArea = document.getElementById('canvas-area');
        const iphoneChassis = document.getElementById('iphone-chassis');
        const iphoneScreen = document.getElementById('iphone-screen');

        let currentPage = 1;
        let isGridVisible = true;
        let isChassisVisible = true;

        // Funzione per navigare a Pagina 2
        function vaiAvanti() {
          if (currentPage === 1) {
            pag1.classList.remove('active');
            pag1.classList.add('hidden-left');

            pag2.classList.remove('hidden-right');
            pag2.classList.add('active');

            currentPage = 2;
            aggiornaUI();
          }
        }

        // Funzione per navigare a Pagina 1
        function tornaIndietro() {
          if (currentPage === 2) {
            pag2.classList.remove('active');
            pag2.classList.add('hidden-right');

            pag1.classList.remove('hidden-left');
            pag1.classList.add('active');

            currentPage = 1;
            aggiornaUI();
          }
        }

        // Aggiorna gli indicatori di stato testuali
        function aggiornaUI() {
          pageIndicator.textContent = 'PAGINA ' + currentPage + ' DI 2';
          if (currentPage === 1) {
            navStep1.className = 'font-bold text-black underline';
            navStep2.className = 'text-neutral-400';
          } else {
            navStep1.className = 'text-neutral-400';
            navStep2.className = 'font-bold text-black underline';
          }
        }

        // Event listener per i bottoni
        btnAvanti.addEventListener('click', vaiAvanti);
        btnIndietro.addEventListener('click', tornaIndietro);
        btnReset.addEventListener('click', tornaIndietro);

        // Supporto per la navigazione con tastiera
        window.addEventListener('keydown', function(e) {
          if (e.key === 'ArrowRight' || e.key === 'Enter') {
            vaiAvanti();
          } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'Escape') {
            tornaIndietro();
          }
        });

        // Gestione Zoom
        function setZoom(scaleValue, activeBtn) {
          deviceScaler.style.transform = 'scale(' + scaleValue + ')';
          [zoom75, zoom90, zoom100].forEach(function(b) {
            if (b) {
              b.classList.remove('bg-black', 'text-white');
              b.classList.add('hover:bg-neutral-100');
            }
          });
          if (activeBtn) {
            activeBtn.classList.remove('hover:bg-neutral-100');
            activeBtn.classList.add('bg-black', 'text-white');
          }
        }

        if (zoom75) zoom75.addEventListener('click', function() { setZoom(0.75, zoom75); });
        if (zoom90) zoom90.addEventListener('click', function() { setZoom(0.9, zoom90); });
        if (zoom100) zoom100.addEventListener('click', function() { setZoom(1.0, zoom100); });

        // Toggle Griglia Sfondo
        toggleGrid.addEventListener('click', function() {
          isGridVisible = !isGridVisible;
          if (isGridVisible) {
            canvasArea.classList.add('bg-wireframe-grid');
            canvasArea.classList.remove('bg-neutral-50');
            toggleGrid.classList.add('bg-black', 'text-white');
            toggleGrid.classList.remove('bg-white', 'text-black');
          } else {
            canvasArea.classList.remove('bg-wireframe-grid');
            canvasArea.classList.add('bg-neutral-50');
            toggleGrid.classList.remove('bg-black', 'text-white');
            toggleGrid.classList.add('bg-white', 'text-black');
          }
        });

        // Toggle Chassis Cornice iPhone 14
        toggleChassis.addEventListener('click', function() {
          isChassisVisible = !isChassisVisible;
          const hardwareBtns = [
            document.getElementById('btn-hardware-mute'),
            document.getElementById('btn-hardware-volup'),
            document.getElementById('btn-hardware-voldown'),
            document.getElementById('btn-hardware-power'),
            document.getElementById('chassis-speaker')
          ];

          if (isChassisVisible) {
            iphoneChassis.className = 'relative mx-auto transition-all duration-300 w-[416px] h-[870px] bg-white border-4 border-black rounded-[54px] wireframe-shadow-lg p-[10px]';
            iphoneScreen.classList.add('border-2', 'border-black', 'rounded-[44px]');
            hardwareBtns.forEach(function(el) { if (el) el.style.display = 'block'; });
            toggleChassis.classList.add('bg-black', 'text-white');
            toggleChassis.classList.remove('bg-white', 'text-black');
          } else {
            iphoneChassis.className = 'relative mx-auto transition-all duration-300 w-[390px] h-[844px] bg-white border-2 border-black wireframe-shadow p-0';
            iphoneScreen.classList.remove('border-2', 'border-black', 'rounded-[44px]');
            hardwareBtns.forEach(function(el) { if (el) el.style.display = 'none'; });
            toggleChassis.classList.remove('bg-black', 'text-white');
            toggleChassis.classList.add('bg-white', 'text-black');
          }
        });
      })();
    </script>
  </body>
</html>
